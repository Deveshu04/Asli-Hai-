      as: { question: "কোনোবাই ফোনত টকা বা OTP বিচাৰিছে নেকি?", press: "টিপক", calling: "ফোন আহি আছে", idle: "টিপাৰ লগে লগে সাথীয়ে আপোনাক ফোন কৰিব। একো পঠিওৱাৰ আগতে তেওঁৰ সৈতে কথা পাতক।", dialing: "ফোন লগোৱা হৈছে…", ringing: "আপোনাৰ ফোন এতিয়াই বাজিব। ধৰক।", demoRinging: "সঁচা ব্যৱহাৰত এতিয়া আপোনাৰ ফোন বাজিলহেঁতেন, আৰু সাথীয়ে আপোনাৰ সৈতে কথা পাতিলহেঁতেন।", noLink: "এই লিংকটো অসম্পূৰ্ণ। পৰিয়ালৰ পৰা নতুন লিংক বিচাৰক।", oldLink: "এই লিংকটোৱে এতিয়া কাম নকৰে। পৰিয়ালৰ পৰা নতুন লিংক বিচাৰক।", failed: "ফোন লগা নাই। আকৌ এবাৰ টিপক।", helpline: "টকা গুচি গ'ল? এতিয়াই ফোন কৰক", demo: "ডেমো: বুটাম টিপিলে সঁচা ফোন নহ'ব।", language: "ভাষা", larger: "ডাঙৰ আখৰ" },
    };

    const seal = document.getElementById("seal");
    const status = document.getElementById("status");
    const params = new URLSearchParams(location.search);
    const familyId = params.get("f");
    const demo = params.has("demo");
    let label = "press";
    let message = { key: "idle", error: false };

    const copy = () => COPY[asli.lang()] || COPY.hi;

    function fitSeal() {
      seal.style.fontSize = "";
      let size = parseFloat(getComputedStyle(seal).fontSize);
      while (seal.scrollWidth > seal.clientWidth && size > 16) {
        size -= 2;
        seal.style.fontSize = size + "px";
      }
    }

    function paint() {
      const text = copy();
      document.getElementById("question").textContent = text.question;
      document.getElementById("helpline").textContent = text.helpline;
      document.getElementById("demo-banner").textContent = text.demo;
      document.getElementById("lang-label").textContent = text.language;
      document.getElementById("size").setAttribute("aria-label", text.larger);
      seal.textContent = text[label];
      status.textContent = text[message.key];
      status.classList.toggle("error", message.error);
      fitSeal();
    }

    function show(key, error = false) {
      message = { key, error };
      paint();
    }

    function ready() {
      label = "press";
      seal.classList.remove("calling");
      seal.disabled = false;
      show("idle");
    }

    function ringing(key) {
      label = "calling";
      seal.classList.add("calling");
      show(key);
      setTimeout(ready, demo ? 8000 : 45000);
    }

    asli.onLang(paint);
    window.addEventListener("resize", fitSeal);
    if (document.fonts) document.fonts.ready.then(fitSeal);
    document.getElementById("demo-banner").hidden = !demo;
    paint();

    if (!familyId && !demo) {
      seal.disabled = true;
      show("noLink", true);
    }

    seal.addEventListener("click", async () => {
      seal.disabled = true;
      seal.classList.remove("stamped");
      void seal.offsetWidth;
      seal.classList.add("stamped");
      if (navigator.vibrate) navigator.vibrate(60);
      show("dialing");

      if (demo) {
        setTimeout(() => ringing("demoRinging"), 900);
        return;
      }
      try {
        const res = await fetch("../trigger", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ family_id: familyId }),
        });
        if (res.status === 404) return show("oldLink", true);
        if (!res.ok) throw new Error(res.status);
        ringing("ringing");
      } catch (err) {
        show("failed", true);
        setTimeout(() => { seal.disabled = false; }, 3000);
      }
    });
  </script>
